name: CI
on:
  push:
  pull_request:
jobs:
  test-and-build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build and verify ad hoc preview archive
        run: tools/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aervane-ad-hoc-preview
          path: dist/Aervane.app.zip

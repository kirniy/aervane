name: CI
on:
  push:
  pull_request:
jobs:
  test-and-build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test npm installer
        run: npm --prefix npm test
      - name: Build and verify ad hoc preview archive
        run: tools/release.sh
      - name: Reject unnotarized public distribution
        run: |
          if python3 tools/prepare-distribution.py > dist/distribution-check.txt 2>&1; then
            cat dist/distribution-check.txt
            exit 1
          fi
          grep -F 'Public releases need Developer ID Application signing' dist/distribution-check.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aervane-ad-hoc-preview
          path: dist/Aervane.app.zip
